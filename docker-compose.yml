version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. TUM-Quantum Reverse Proxy Gateway
  # Drops in front of existing enterprise web servers (Nginx/IIS/Apache) to provide
  # instant Post-Quantum TLS 1.3 termination and quantum header injection.
  # ----------------------------------------------------------------------------
  tum-quantum-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: tumquantum/reverse-proxy-gateway:1.0.0
    container_name: tum-quantum-gateway
    restart: unless-stopped
    ports:
      - "80:80"     # Plaintext HTTP (Enforces automatic 301 redirect to HTTPS)
      - "443:443"   # Post-Quantum TLS 1.3 HTTPS (X25519MLKEM768 / ML-DSA-65)
    environment:
      - UPSTREAM_LEGACY_HOST=upstream-legacy-server
      - UPSTREAM_LEGACY_PORT=80
      - PQC_ENGINE_HOST=tum-quantum-engine
      - PQC_ENGINE_PORT=5100
      - TZ=Asia/Bangkok
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - gateway-ssl-data:/etc/ssl/tum-quantum
    depends_on:
      tum-quantum-engine:
        condition: service_healthy
      upstream-legacy-server:
        condition: service_started
    networks:
      - quantum-mesh
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost/gateway/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. TUM-Quantum Cryptography Service Engine
  # Core microservice providing NIST FIPS 203/204 verification, PQC-OIDC tokens,
  # RFC 3161 TSA, FIPS 140-3 audits, DudeCT timing analysis, and HNDL simulations.
  # ----------------------------------------------------------------------------
  tum-quantum-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: tumquantum/engine-service:1.0.0
    container_name: tum-quantum-engine
    restart: unless-stopped
    ports:
      - "5100:5100" # Internal sovereign API endpoint
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5100
      - DOTNET_EnableDiagnostics=0
      - TZ=Asia/Bangkok
    networks:
      - quantum-mesh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 3. Upstream Enterprise Legacy Web Server (Mock Nginx / IIS / Apache)
  # Demonstrates zero-code-change quantum adoption. The legacy app sits behind the
  # gateway on the internal mesh and consumes the injected X-Quantum-Safe headers.
  # ----------------------------------------------------------------------------
  upstream-legacy-server:
    image: nginx:alpine
    container_name: upstream-legacy-server
    restart: unless-stopped
    ports:
      - "8080:80"   # Direct legacy port for comparative verification / side-by-side inspection
    volumes:
      - ./gateway/mock-upstream/index.html:/usr/share/nginx/html/index.html:ro
      - ./gateway/mock-upstream/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - quantum-mesh

networks:
  quantum-mesh:
    driver: bridge
    name: tum-quantum-network

volumes:
  gateway-ssl-data:
    name: tum-quantum-gateway-ssl
