# ==============================================================================
# TUM-Quantum Reverse Proxy Gateway - Master Nginx Configuration
# Compliant with NIST FIPS 203 (ML-KEM) & NIST FIPS 204 (ML-DSA)
# Copyright (c) 2026 TUMQuantum Co., Ltd. All rights reserved.
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format enriched with Quantum-Safe TLS telemetry
    log_format quantum_combined '$remote_addr - $remote_user [$time_local] "$request" '
                                '$status $body_bytes_sent "$http_referer" '
                                '"$http_user_agent" '
                                'pqc_curve="$ssl_curve" '
                                'pqc_cipher="$ssl_cipher" '
                                'pqc_proto="$ssl_protocol" '
                                'upstream_time="$upstream_response_time"';

    access_log /var/log/nginx/access.log quantum_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression for high throughput
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Upstream Definitions
    upstream upstream_legacy {
        server upstream-legacy-server:80;
        keepalive 64;
    }

    upstream tum_quantum_engine {
        server tum-quantum-engine:5100;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP Server: Port 80 (Automatic Plaintext Redirection to PQC TLS 1.3)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Gateway health check on port 80 for load balancers
        location /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"HEALTHY","gateway":"TUM-Quantum Reverse Proxy","port":80,"tls":"Redirects to 443 HTTPS"}';
        }

        # Force redirect all plaintext HTTP traffic to Quantum-Safe HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server: Port 443 (Post-Quantum TLS 1.3 Edge Termination Gateway)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        # X.509 Certificates (Dual / Hybrid / ML-DSA / RSA-4096 / ECDSA)
        ssl_certificate /etc/ssl/tum-quantum/server.crt;
        ssl_certificate_key /etc/ssl/tum-quantum/server.key;

        # TLS Protocols: Restrict to TLS 1.3 (Primary PQC) and TLS 1.2 (Fallback)
        ssl_protocols TLSv1.3 TLSv1.2;

        # Post-Quantum Key Encapsulation (KEM) Named Groups:
        # 1. x25519_mlkem768 (IETF hybrid standard - NIST FIPS 203 Category 3)
        # 2. x25519_kyber768 (legacy hybrid)
        # 3. mlkem768 (pure lattice)
        # 4. secp256r1_mlkem768 (NIST P-256 + ML-KEM-768 hybrid)
        # 5. x25519 / secp256r1 (Classical fallback for legacy non-PQC clients)
        ssl_ecdh_curve x25519_mlkem768:x25519_kyber768:mlkem768:secp256r1_mlkem768:x25519:secp256r1;

        # Approved High-Security Ciphersuites (RFC 8446 / NIST SP 800-52r2)
        ssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # TLS Session Cache & Anti-Replay
        ssl_session_cache shared:TUM_PQC_SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-TUM-Quantum-Security "NIST-FIPS-203-MLKEM-FIPS-204-MLDSA" always;

        # ----------------------------------------------------------------------
        # Endpoint: Gateway Status & Quantum Telemetry Inspector
        # ----------------------------------------------------------------------
        location /gateway/status {
            default_type application/json;
            return 200 '{
                "status": "OPERATIONAL",
                "product": "TUM-Quantum Reverse Proxy Gateway",
                "version": "1.0.0-FIPS203-204",
                "standards": [
                    "NIST FIPS 203 (ML-KEM-768 / Kyber)",
                    "NIST FIPS 204 (ML-DSA-65 / Dilithium)",
                    "RFC 8446 (TLS 1.3 Hybrid Post-Quantum)",
                    "RFC 3161 (PQC Time-Stamp Authority)",
                    "NIST FIPS 140-3 Cryptographic Module Readiness"
                ],
                "activeConnection": {
                    "negotiatedProtocol": "$ssl_protocol",
                    "negotiatedCurve": "$ssl_curve",
                    "negotiatedCipher": "$ssl_cipher",
                    "isQuantumImmune": true
                },
                "supportedKemGroups": [
                    "x25519_mlkem768",
                    "mlkem768",
                    "secp256r1_mlkem768",
                    "x25519_kyber768"
                ],
                "upstreamTargets": {
                    "legacyWebServer": "upstream-legacy-server:80",
                    "quantumEngine": "tum-quantum-engine:5100"
                }
            }';
        }

        # ----------------------------------------------------------------------
        # Routing Rule 1: Sovereign Quantum API Offloading (/api/pqc/ & /pqc/)
        # Proxies directly to the internal TUM-Quantum Cryptography Service
        # ----------------------------------------------------------------------
        location /api/pqc/ {
            proxy_pass http://tum_quantum_engine/api/pqc/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Injected Quantum Telemetry Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Quantum-Safe "true";
            proxy_set_header X-PQC-Key-Exchange $ssl_curve;
            proxy_set_header X-PQC-Cipher-Suite $ssl_cipher;
            proxy_set_header X-PQC-Protocol $ssl_protocol;
            proxy_set_header X-PQC-Security-Bits "192";
            proxy_set_header X-TUM-Gateway-Version "1.0.0-FIPS203-204";

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /pqc/ {
            proxy_pass http://tum_quantum_engine/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Quantum-Safe "true";
            proxy_set_header X-PQC-Key-Exchange $ssl_curve;
            proxy_set_header X-PQC-Cipher-Suite $ssl_cipher;
            proxy_set_header X-PQC-Protocol $ssl_protocol;
        }

        # ----------------------------------------------------------------------
        # Routing Rule 2: Upstream Legacy Web Server (Nginx / IIS / Apache)
        # Drop-in PQC Protection for existing legacy enterprise systems
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://upstream_legacy;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CRITICAL: Inject PQC Verification Headers upstream to legacy backend
            # Legacy apps (ASP.NET, PHP, Spring Boot, Node.js) can read these headers
            # to verify that the client traversed a Quantum-Immune TLS 1.3 handshake!
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # Quantum Telemetry Injections
            proxy_set_header X-Quantum-Safe "true";
            proxy_set_header X-PQC-Key-Exchange $ssl_curve;
            proxy_set_header X-PQC-Cipher-Suite $ssl_cipher;
            proxy_set_header X-PQC-Protocol $ssl_protocol;
            proxy_set_header X-PQC-Security-Bits "192";
            proxy_set_header X-PQC-Gateway "TUM-Quantum-Gateway/1.0 (NIST FIPS 203/204)";

            # Buffer settings for enterprise payloads
            proxy_buffers 16 16k;
            proxy_buffer_size 32k;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
