server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint returning received headers for testing and inspection
    location /headers {
        default_type application/json;
        return 200 '{"status":"SUCCESS","receivedHeaders":{"xQuantumSafe":"$http_x_quantum_safe","xPqcKeyExchange":"$http_x_pqc_key_exchange","xPqcCipherSuite":"$http_x_pqc_cipher_suite","xPqcProtocol":"$http_x_pqc_protocol","xPqcSecurityBits":"$http_x_pqc_security_bits","xPqcGateway":"$http_x_pqc_gateway"}}';
    }
}
